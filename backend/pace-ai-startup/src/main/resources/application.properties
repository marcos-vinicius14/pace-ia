# Application Configuration
spring.application.name=pace-ai

# Server
server.port=8080

# PostgreSQL (configured via environment or Spring Boot profiles)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/paceai}
spring.datasource.username=${DATABASE_USER:paceai}
spring.datasource.password=${DATABASE_PASSWORD:paceai}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis Session
spring.session.store-type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# AWS SQS (configured via environment)
spring.cloud.aws.sqs.enabled=true
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}

# Spring AI (OpenAI)
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=gpt-4

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# Logging
logging.level.com.paceai=DEBUG
logging.level.org.springframework.security=DEBUG
